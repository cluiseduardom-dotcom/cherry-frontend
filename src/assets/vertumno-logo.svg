<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-labelledby="title desc">
  <title id="title">VERTUMNO</title>
  <desc id="desc">Logotipo VERTUMNO metálico em dourado, azul e prata, com fundo transparente.</desc>
  <defs>
    <linearGradient id="goldFront" x1="0" y1="0" x2="1" y2=".18">
      <stop offset="0" stop-color="#fff1ce"/><stop offset=".16" stop-color="#d5aa63"/><stop offset=".38" stop-color="#f7dfa0"/><stop offset=".62" stop-color="#c99b50"/><stop offset=".83" stop-color="#e8c77f"/><stop offset="1" stop-color="#9a6a32"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#f4d58c"/><stop offset=".32" stop-color="#8a5b2a"/><stop offset=".65" stop-color="#d4a45c"/><stop offset="1" stop-color="#3b291c"/>
    </linearGradient>
    <linearGradient id="blueFront" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0" stop-color="#06172a"/><stop offset=".23" stop-color="#123c61"/><stop offset=".52" stop-color="#185783"/><stop offset=".78" stop-color="#0b2a47"/><stop offset="1" stop-color="#020b15"/>
    </linearGradient>
    <linearGradient id="silverFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset=".2" stop-color="#aeb8c0"/><stop offset=".42" stop-color="#eef0ef"/><stop offset=".72" stop-color="#89949d"/><stop offset="1" stop-color="#35434e"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <!-- Face dourada principal e sua lateral chanfrada -->
    <path d="M16 16 L156 16 L321 326 L299 361 L208 361 L36 55 Q22 31 16 16Z" fill="url(#goldFront)"/>
    <path d="M156 16 L177 16 L343 326 L321 361 L299 361 L321 326Z" fill="url(#goldEdge)"/>
    <path d="M16 16 L156 16 L171 34 L50 34 L208 361 L194 361 L36 55 Q22 31 16 16Z" fill="#fff0c6" opacity=".38"/>
    <!-- Corpo azul da haste direita -->
    <path d="M323 16 L469 16 L308 267 L284 307 L263 340 L245 307 L273 199Z" fill="url(#blueFront)"/>
    <path d="M469 16 L449 16 L291 263 L273 199 L308 267 L284 307 L263 340 L284 307 L308 267Z" fill="#071321" opacity=".78"/>
    <!-- Plano prateado interno da marca -->
    <path d="M469 16 L390 16 L273 199 L307 267Z" fill="url(#silverFront)"/>
    <path d="M390 16 L378 16 L263 196 L273 199Z" fill="#f7f7f5" opacity=".55"/>
    <path d="M273 199 L307 267 L284 307 L263 340 L245 307Z" fill="#06121e" opacity=".65"/>
  </g>
  <text x="260" y="425" text-anchor="middle" fill="#0b1f4d" stroke="#0b1f4d" stroke-width=".35" paint-order="stroke" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="53" font-weight="800" letter-spacing="2.8">VERTUMNO</text>
</svg>