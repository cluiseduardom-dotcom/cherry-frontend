<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 363" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradientes Metálicos Dourados Baseados na Referência Visual -->
    <linearGradient id="gold-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d4"/>
      <stop offset="35%" stop-color="#e0ac5d"/>
      <stop offset="70%" stop-color="#b68235"/>
      <stop offset="100%" stop-color="#7a4c0f"/>
    </linearGradient>

    <linearGradient id="gold-leaf-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c9"/>
      <stop offset="40%" stop-color="#dfaf60"/>
      <stop offset="75%" stop-color="#b88435"/>
      <stop offset="100%" stop-color="#7e4c0d"/>
    </linearGradient>

    <linearGradient id="gold-leaf-bot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72450c"/>
      <stop offset="30%" stop-color="#a8742b"/>
      <stop offset="70%" stop-color="#dca958"/>
      <stop offset="100%" stop-color="#fcedc2"/>
    </linearGradient>

    <radialGradient id="gold-cherry-l" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5d9"/>
      <stop offset="25%" stop-color="#f2cf88"/>
      <stop offset="55%" stop-color="#ce9a44"/>
      <stop offset="80%" stop-color="#9a651c"/>
      <stop offset="100%" stop-color="#5a3306"/>
    </radialGradient>

    <radialGradient id="gold-cherry-r" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fff5d9"/>
      <stop offset="25%" stop-color="#f2cf88"/>
      <stop offset="55%" stop-color="#ce9a44"/>
      <stop offset="80%" stop-color="#9a651c"/>
      <stop offset="100%" stop-color="#5a3306"/>
    </radialGradient>

    <linearGradient id="gold-specular" x1="0%" y1="0%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fff3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#dfad58" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="cherry-symbol-vectors">
    <!-- Folha Dourada com Nervura Central -->
    <path d="M 175 62 C 195 20, 260 25, 318 105 C 336 130, 342 165, 335 190 C 310 185, 260 160, 222 135 C 195 116, 180 88, 175 62 Z" fill="url(#gold-leaf-top)"/>
    <path d="M 175 62 C 185 95, 215 140, 275 178 C 305 196, 328 194, 335 190 C 325 208, 298 220, 265 210 C 220 196, 188 152, 175 62 Z" fill="url(#gold-leaf-bot)"/>
    <path d="M 175 62 C 225 110, 280 155, 335 190" stroke="#fef4d8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Haste Esquerda -->
    <path d="M 172 45 C 145 70, 110 130, 96 205 C 93 218, 96 226, 102 228 C 107 230, 112 222, 115 210 C 128 140, 160 85, 182 52 Z" fill="url(#gold-loop)"/>

    <!-- Haste Direita -->
    <path d="M 178 52 C 185 90, 202 160, 220 220 C 223 232, 228 238, 234 236 C 240 234, 241 224, 238 212 C 222 155, 202 90, 188 48 Z" fill="url(#gold-loop)"/>

    <!-- Nó Superior -->
    <path d="M 170 38 C 162 30, 165 15, 178 12 C 190 10, 196 22, 190 34 C 185 44, 176 48, 170 38 Z" fill="url(#gold-loop)"/>
    <ellipse cx="178" cy="22" rx="4.5" ry="6.5" fill="#fef6dc" opacity="0.6"/>

    <!-- Cereja Esquerda -->
    <g id="left-cherry">
      <path d="M 102 216 C 85 202, 54 205, 30 226 C 2 252, -1 292, 16 322 C 34 354, 78 368, 116 355 C 148 344, 168 316, 164 282 C 160 252, 138 238, 114 235 C 108 234, 104 225, 102 216 Z" fill="url(#gold-cherry-l)"/>
      <path d="M 88 230 C 98 244, 118 244, 126 235" stroke="#683d0a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65"/>
      <path d="M 28 245 C 45 228, 75 228, 92 242 C 90 260, 65 285, 42 282 C 28 280, 22 262, 28 245 Z" fill="url(#gold-specular)"/>
    </g>

    <!-- Cereja Direita -->
    <g id="right-cherry">
      <path d="M 226 226 C 205 212, 170 216, 148 238 C 122 264, 124 306, 142 336 C 162 368, 210 380, 248 365 C 282 352, 305 320, 300 285 C 295 252, 270 238, 244 235 C 236 234, 230 228, 226 226 Z" fill="url(#gold-cherry-r)"/>
      <path d="M 208 240 C 220 254, 245 254, 255 242" stroke="#683d0a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65"/>
      <path d="M 148 255 C 168 238, 202 238, 222 254 C 220 274, 192 302, 168 298 C 150 295, 142 274, 148 255 Z" fill="url(#gold-specular)"/>
    </g>
  </g>
</svg>